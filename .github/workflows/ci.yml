name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: server
        run: npm install
      - name: Smoke
        working-directory: server
        run: |
          node src/index.js &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8790/api/health >/dev/null && break
            sleep 0.5
          done
          npm run smoke

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: web
        run: npm install
      - name: Build (typecheck + vite)
        working-directory: web
        run: npm run build

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Sync
        working-directory: ai-service
        run: uv sync
      - name: Import check
        working-directory: ai-service
        run: uv run python -c "import app.main; print('ok')"
